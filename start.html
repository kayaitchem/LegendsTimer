<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legends — wybierz, dokąd idziesz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='%23120d07' stroke='%23d9b45b' stroke-width='4'/%3E%3Cpath d='M23 13h10v29h18v9H23z' fill='%23f2d98a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080603; --panel:#150f08; --line:#4a3618;
  --gold:#d9b45b; --gold-2:#f5e2a6; --gold-dim:#8d7333;
  --blood:#7a1414; --blood-2:#b52020; --parch:#ead9b4; --muted:#9c8a68;
}
*{ box-sizing:border-box; }
html,body{ min-height:100%; }
body{
  margin:0; color:var(--parch); font:15px/1.5 'Inter',Arial,sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 20px; overflow-x:hidden;
  background:
    radial-gradient(900px 520px at 50% 30%, rgba(217,180,91,.12), transparent 65%),
    radial-gradient(800px 500px at 15% 105%, rgba(122,20,20,.28), transparent 60%),
    radial-gradient(800px 500px at 90% 105%, rgba(31,95,168,.12), transparent 60%),
    linear-gradient(180deg,#0d0a05,#050403 75%);
  background-attachment:fixed;
}
a{ color:inherit; text-decoration:none; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

/* iskrzący pył */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none;
  background:
    radial-gradient(2px 2px at 14% 26%, rgba(245,226,166,.55), transparent 60%),
    radial-gradient(2px 2px at 80% 16%, rgba(217,180,91,.45), transparent 60%),
    radial-gradient(1.5px 1.5px at 60% 74%, rgba(245,226,166,.4), transparent 60%),
    radial-gradient(1.5px 1.5px at 28% 84%, rgba(217,180,91,.35), transparent 60%),
    radial-gradient(2px 2px at 90% 60%, rgba(245,226,166,.3), transparent 60%);
  animation:dust 7s ease-in-out infinite;
}
@keyframes dust{ 0%,100%{ opacity:.35; transform:translateY(0); } 50%{ opacity:.9; transform:translateY(-14px); } }

.hero{ text-align:center; margin-bottom:38px; animation:fadeUp .6s ease both; }
.logo{ width:clamp(70px,12vw,96px); height:auto; filter:drop-shadow(0 0 20px rgba(217,180,91,.45)) drop-shadow(0 6px 14px rgba(0,0,0,.9)); animation:glow 3.5s ease-in-out infinite; }
@keyframes glow{
  0%,100%{ filter:drop-shadow(0 0 14px rgba(217,180,91,.35)) drop-shadow(0 6px 14px rgba(0,0,0,.9)); }
  50%{ filter:drop-shadow(0 0 28px rgba(245,226,166,.7)) drop-shadow(0 6px 14px rgba(0,0,0,.9)); }
}
h1{
  margin:14px 0 0; font-family:'Cinzel',Georgia,serif; font-weight:900; letter-spacing:.2em;
  font-size:clamp(30px,6vw,52px);
  background:linear-gradient(100deg,var(--gold-2) 30%,#fff8dd 48%,var(--gold-2) 66%);
  background-size:280% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 #2a1d0a); animation:shine 4.5s linear infinite;
}
@keyframes shine{ from{ background-position:180% 0; } to{ background-position:-80% 0; } }
.hero p{ margin:8px 0 0; color:var(--muted); letter-spacing:.3em; text-transform:uppercase; font-size:12px; }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }

.choices{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px; width:min(860px,100%); }
.choice{
  position:relative; overflow:hidden; display:flex; flex-direction:column; gap:12px; min-height:270px;
  padding:30px 28px; border-radius:18px; border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(44,32,16,.9),rgba(18,12,6,.95));
  box-shadow:0 20px 50px rgba(0,0,0,.55);
  transition:transform .3s cubic-bezier(.2,.9,.3,1.2), border-color .3s, box-shadow .3s;
  animation:fadeUp .6s ease both;
}
.choice:nth-child(1){ animation-delay:.15s; }
.choice:nth-child(2){ animation-delay:.28s; }
.choice::before{
  content:""; position:absolute; inset:0; opacity:0; transition:opacity .35s;
  background:radial-gradient(420px 220px at 50% 0%, var(--tint), transparent 70%);
}
.choice::after{
  content:""; position:absolute; top:0; left:-70%; width:40%; height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent); transform:skewX(-20deg);
  transition:left .7s ease;
}
.choice:hover, .choice:focus-visible{ transform:translateY(-8px); border-color:var(--edge); box-shadow:0 26px 60px rgba(0,0,0,.65), 0 0 40px var(--tint); }
.choice:hover::before, .choice:focus-visible::before{ opacity:1; }
.choice:hover::after{ left:130%; }
.choice.panel{ --edge:var(--gold); --tint:rgba(217,180,91,.28); }
.choice.timer{ --edge:var(--blood-2); --tint:rgba(181,32,32,.32); }

.icon{
  position:relative; display:grid; place-items:center; width:64px; height:64px; border-radius:16px;
  border:1px solid var(--edge); background:rgba(0,0,0,.4); color:var(--edge);
  transition:transform .35s cubic-bezier(.2,.9,.3,1.4);
}
.choice:hover .icon{ transform:scale(1.1) rotate(-6deg); }
.choice.timer .icon{ color:#ff9d9d; }
.choice h2{
  position:relative; margin:6px 0 0; font-family:'Cinzel',Georgia,serif; font-weight:900; letter-spacing:.12em;
  font-size:26px; color:var(--gold-2);
}
.choice p{ position:relative; margin:0; color:#cdbb95; }
.go{
  position:relative; margin-top:auto; display:inline-flex; align-items:center; gap:8px;
  font-weight:700; letter-spacing:.1em; font-size:12.5px; text-transform:uppercase; color:var(--edge);
}
.choice.timer .go{ color:#ff9d9d; }
.go svg{ transition:transform .3s; }
.choice:hover .go svg{ transform:translateX(6px); }

.foot{ margin-top:34px; color:var(--muted); font-size:12.5px; animation:fadeUp .6s ease .45s both; }

@media (max-width:720px){
  .choices{ grid-template-columns:1fr; }
  .choice{ min-height:0; padding:24px 22px; }
}
@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>
<body>
  <header class="hero">
    <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Logo Legends">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2bf"/><stop offset="1" stop-color="#d9b45b"/></linearGradient></defs>
      <rect x="2" y="2" width="60" height="60" rx="14" fill="#120d07" stroke="#d9b45b" stroke-width="3.5"/>
      <path d="M23 13h10v29h18v9H23z" fill="url(#lg)"/>
    </svg>
    <h1>LEGENDS</h1>
    <p>Wybierz, dokąd idziesz</p>
  </header>

  <main class="choices">
    <a class="choice panel" href="panel.html">
      <span class="icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 19.5 6v6c0 4.5-3.2 7.6-7.5 9-4.3-1.4-7.5-4.5-7.5-9V6z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg>
      </span>
      <h2>PANEL GRACZA</h2>
      <p>Misje tygodniowe z obozów, kalendarz wydarzeń, przewodnik dla nowych i wiadomości.</p>
      <span class="go">Wejdź <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

    <a class="choice timer" href="index.html">
      <span class="icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12M6 21h12M7 3c0 5 3 6 5 9-2 3-5 4-5 9M17 3c0 5-3 6-5 9 2 3 5 4 5 9"/></svg>
      </span>
      <h2>TIMER</h2>
      <p>Respawny bossów z polskim lektorem AI, wspólne timery i czat ekipy na żywo.</p>
      <span class="go">Wejdź <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
  </main>

  <footer class="foot">Legends · Metin2</footer>
</body>
</html>
